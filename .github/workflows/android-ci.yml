name: Android CI

# Compila, testa e lint-a il progetto su ogni PR verso main e su ogni push
# a main. Esiste perché nessuno degli ambienti usati finora (sessioni
# cloud con rete limitata, o macchine senza Android SDK) poteva farlo in
# autonomia — qui gira su un runner GitHub con rete e SDK completi.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Imposta JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Imposta Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa piattaforma e build-tools richiesti
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Permessi di esecuzione per gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test unitari (domain/)
        run: ./gradlew test --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Compila APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Carica report dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Carica report lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
